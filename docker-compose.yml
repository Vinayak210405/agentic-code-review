services:
  agentic-code-review:
    build: .
    container_name: agentic_code_review_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - review-data:/app/data   # persists LangGraph checkpoints (paused HITL reviews)
    restart: unless-stopped

  qdrant:                       # optional: docker compose --profile qdrant up
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"

volumes:
  review-data:
